<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esqueci minha senha | Receitas da Vovó</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="auth-page"><div style="width:100%;max-width:440px;">
{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}{% for c,m in messages %}<div class="flash flash-{{ c }}">{{ m }}</div>{% endfor %}{% endif %}{% endwith %}
<div class="form-card">
<div class="auth-logo"><span class="emoji"><i class="fas fa-utensils"></i></span><h1>Receitas da Vovó</h1><p>Recupere o acesso à sua conta</p></div>
<form method="POST"><div class="form-group"><label>E-mail</label><input type="email" name="email" required autofocus /></div>
<button type="submit" class="btn btn-primary btn-full">Enviar link</button></form>
<p class="link-alt"><a href="{{ url_for('login') }}">Voltar para o login</a></p>
</div></div>
<script src="{{ url_for('static', filename='js/main.js') }}"></script></body></html>
